<!DOCTYPE html>

<html>

<head>

    <title>Home - PINCO</title>

    <style>

        body {
            font-family: Arial;
            text-align: center;
            padding-top: 80px;
            background: linear-gradient(190deg, rgb(0,157,255), rgb(171,219,255));
            min-height: 100vh;
            margin: 0;
        }

        .kotak {
            background: white;
            padding: 40px;
            border-radius: 25px;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #009DFF;
        }

        button {
            background: rgb(0,157,255);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: rgb(0,130,211);
        }

    </style>

</head>

<body>

    <div class="kotak">

        <h1>🎉 Selamat Datang!</h1>

        <p id="sapa"></p>

        <p>Ini halaman utama, hanya bisa dilihat setelah Login!</p>

        <br>

        <button onclick="keluar()">LOG OUT</button>

    </div>

    <script>

        let email = localStorage.getItem("sedangLogin");
        let dataPengguna = JSON.parse(localStorage.getItem("akunPengguna")) || {};

        if (!email || !dataPengguna[email]) {

            alert("⚠️ Harap LOGIN dulu untuk masuk halaman ini!");

            window.location.href = "login.html";

        } else {

            document.getElementById("sapa").innerHTML =
                "Halo, <strong>" + dataPengguna[email].nama + "</strong>! Semoga harimu menyenangkan 😊";

        }

        function keluar() {

            localStorage.removeItem("sedangLogin");

            alert("✅ Berhasil Log Out!");

            window.location.href = "login.html";

        }

    </script>

</body>

</html>
